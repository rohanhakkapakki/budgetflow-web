      // ==========================================
      // FORMATTING UTILITIES (format.ts)
      // ==========================================
      function formatINR(amount, showDecimals = false) {
        if (isNaN(amount) || amount === null || amount === undefined) return '₹0';
        const isNegative = amount < 0;
        const abs = Math.abs(amount);
        const formatted = new Intl.NumberFormat('en-IN', {
          style: 'currency',
          currency: 'INR',
          minimumFractionDigits: showDecimals ? 2 : 0,
          maximumFractionDigits: showDecimals ? 2 : 0,
        }).format(abs);
        return isNegative ? `-${formatted}` : formatted;
      }

      function formatCompactINR(amount) {
        if (isNaN(amount)) return '₹0';
        const isNegative = amount < 0;
        const abs = Math.abs(amount);
        let str = `₹${abs.toFixed(0)}`;
        if (abs >= 100000) {
          str = `₹${(abs / 100000).toFixed(1)}L`;
        } else if (abs >= 1000) {
          str = `₹${(abs / 1000).toFixed(1)}k`;
        }
        return isNegative ? `-${str}` : str;
      }

      function timeAgo(dateString) {
        if (!dateString) return 'Just now';
        const diffMs = Date.now() - new Date(dateString).getTime();
        const diffDays = Math.floor(diffMs / 86400000);
        if (diffDays <= 0) return 'Today';
        if (diffDays === 1) return 'Yesterday';
        if (diffDays < 30) return `${diffDays} days ago`;
        const diffMonths = Math.floor(diffDays / 30);
        return `${diffMonths} month${diffMonths > 1 ? 's' : ''} ago`;
      }

      function getOrdinalSuffix(day) {
        if (day > 3 && day < 21) return `${day}th`;
        switch (day % 10) {
          case 1: return `${day}st`;
          case 2: return `${day}nd`;
          case 3: return `${day}rd`;
          default: return `${day}th`;
        }
      }

      function getDaysUntilCycle(targetDay = 20) {
        const now = new Date();
        const currentDay = now.getDate();
        const currentMonth = now.getMonth();
        const currentYear = now.getFullYear();

        const safeTargetDay = Math.min(Math.max(targetDay, 1), 31);
        const formattedTarget = getOrdinalSuffix(safeTargetDay);

        let nextTargetDate = new Date(currentYear, currentMonth, safeTargetDay);
        let cycleStartDate;

        if (currentDay >= safeTargetDay) {
          cycleStartDate = new Date(currentYear, currentMonth, safeTargetDay);
          nextTargetDate = new Date(currentYear, currentMonth + 1, safeTargetDay);
        } else {
          cycleStartDate = new Date(currentYear, currentMonth - 1, safeTargetDay);
          nextTargetDate = new Date(currentYear, currentMonth, safeTargetDay);
        }

        const diffTime = nextTargetDate.getTime() - now.getTime();
        const daysLeft = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));

        const startMonthStr = cycleStartDate.toLocaleString('default', { month: 'short' });
        const nextMonthStr = nextTargetDate.toLocaleString('default', { month: 'short' });
        const currentCycleRange = `${startMonthStr} ${safeTargetDay} – ${nextMonthStr} ${safeTargetDay}`;

        return {
          daysLeft,
          label: `${daysLeft}D Left • Cycle starts ${formattedTarget}`,
          cycleStartDay: safeTargetDay,
          formattedTarget,
          currentCycleRange,
        };
      }

      function isCreditCard(account) {
        return account && (account.type === 'CREDIT_CARD' || account.type === 'RUPAY_CC');
      }

      function isBankAccount(account) {
        return account && (account.type === 'BANK' || account.type === 'BUFFER_BANK' || account.type === 'SAVINGS_BANK');
      }

      // ==========================================
      // DATABASE HELPER (Exact SQLite/Local Persistence)
      // ==========================================
      const STORAGE_KEY = 'budgetflow_prod_db_v1';
      const CYCLE_KEY = 'budgetflow_cycle_day_v2';

      const SEED_DATA = {
        cycleStartDay: 1,
        accounts: [
          {
            id: 1,
            name: 'Primary Bank Account',
            type: 'BANK',
            linked_bank_id: null,
            balance: 0,
            unbilled_dues: 0,
          },
        ],
        payees: [],
        friend_debts: [],
        transactions: [],
        nextId: {
          accounts: 2,
          payees: 1,
          transactions: 1,
          friend_debts: 1,
        },
      };

      class DatabaseHelper {
        constructor() {
          this.ensureInitialized();
        }

        getState() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
              this.saveState(SEED_DATA);
              return JSON.parse(JSON.stringify(SEED_DATA));
            }
            const parsed = JSON.parse(raw);
            if (!parsed.cycleStartDay) parsed.cycleStartDay = 1;
            return parsed;
          } catch {
            return JSON.parse(JSON.stringify(SEED_DATA));
          }
        }

        saveState(state) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        ensureInitialized() {
          try {
            localStorage.removeItem('budgetflow_sqlite_db_v2');
            localStorage.removeItem('budgetflow_sqlite_db_v3');
          } catch {}
          if (!localStorage.getItem(STORAGE_KEY)) {
            this.saveState(SEED_DATA);
          }
        }

        resetToSample() {
          this.saveState(SEED_DATA);
          localStorage.removeItem(CYCLE_KEY);
        }

        getCycleStartDay() {
          const stored = localStorage.getItem(CYCLE_KEY);
          if (stored) {
            const parsed = parseInt(stored, 10);
            if (!isNaN(parsed) && parsed >= 1 && parsed <= 31) return parsed;
          }
          const state = this.getState();
          return state.cycleStartDay || 1;
        }

        setCycleStartDay(day) {
          const cleanDay = Math.min(Math.max(day, 1), 31);
          const state = this.getState();
          state.cycleStartDay = cleanDay;
          this.saveState(state);
          localStorage.setItem(CYCLE_KEY, cleanDay.toString());
        }

        async getAccounts() {
          const state = this.getState();
          return [...state.accounts];
        }

        async getAccountById(id) {
          const state = this.getState();
          return state.accounts.find((a) => a.id === id);
        }

        async createAccount(data) {
          const state = this.getState();
          const newId = state.nextId.accounts++;
          const newAccount = {
            id: newId,
            name: data.name.trim(),
            type: data.type,
            linked_bank_id: data.linked_bank_id || null,
            balance: data.balance || 0,
            unbilled_dues: data.unbilled_dues || 0,
            credit_limit: data.credit_limit,
          };
          state.accounts.push(newAccount);
          this.saveState(state);
          return newAccount;
        }

        async deleteAccount(accountId) {
          const state = this.getState();
          const bankCount = state.accounts.filter(isBankAccount).length;
          const target = state.accounts.find((a) => a.id === accountId);
          if (!target) return false;

          if (isBankAccount(target) && bankCount <= 1) {
            throw new Error('You must keep at least one active bank account.');
          }

          state.accounts = state.accounts.filter((a) => a.id !== accountId);
          for (const acc of state.accounts) {
            if (acc.linked_bank_id === accountId) {
              acc.linked_bank_id = null;
            }
          }
          this.saveState(state);
          return true;
        }

        async updateAccountBalance(accountId, newBalance) {
          const state = this.getState();
          const acc = state.accounts.find((a) => a.id === accountId);
          if (acc) {
            acc.balance = newBalance;
            this.saveState(state);
          }
        }

        async updateAccountDues(accountId, newDues) {
          const state = this.getState();
          const acc = state.accounts.find((a) => a.id === accountId);
          if (acc) {
            acc.unbilled_dues = Math.max(0, newDues);
            this.saveState(state);
          }
        }

        async insertTransaction(row) {
          const state = this.getState();
          const newId = state.nextId.transactions++;
          const newTx = { ...row, id: newId };
          state.transactions.unshift(newTx);
          this.saveState(state);
          return newId;
        }

        async getRecentTransactions(limit = 20) {
          const state = this.getState();
          const sorted = [...state.transactions].sort(
            (a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
          );
          return sorted.slice(0, limit);
        }

        async getPayees() {
          const state = this.getState();
          return [...state.payees].sort((a, b) => a.name.localeCompare(b.name));
        }

        async insertPayee(name, phone = '') {
          const state = this.getState();
          const trimmed = name.trim();
          const existing = state.payees.find(
            (p) => p.name.toLowerCase() === trimmed.toLowerCase()
          );
          if (existing) return existing.id;

          const newId = state.nextId.payees++;
          state.payees.push({ id: newId, name: trimmed, phone: phone.trim() });
          this.saveState(state);
          return newId;
        }

        reconcilePayeeDebts(state, payeeId) {
          const pendingDebts = state.friend_debts.filter(
            (d) => d.payee_id === payeeId && d.status === 'PENDING'
          );
          if (pendingDebts.length === 0) return false;

          const lentDebts = pendingDebts
            .filter((d) => d.type === 'LENT')
            .sort((a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime());

          const borrowedDebts = pendingDebts
            .filter((d) => d.type === 'BORROWED')
            .sort((a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime());

          const totalPendingLent = lentDebts.reduce(
            (sum, d) => sum + (d.amount - (d.amount_settled || 0)), 0
          );
          const totalPendingBorrowed = borrowedDebts.reduce(
            (sum, d) => sum + (d.amount - (d.amount_settled || 0)), 0
          );

          const offsetAvailable = Math.min(totalPendingLent, totalPendingBorrowed);
          if (offsetAvailable <= 0) return false;

          const now = new Date().toISOString();
          let remainingOffsetLent = offsetAvailable;
          for (const d of lentDebts) {
            if (remainingOffsetLent <= 0) break;
            const unSettled = d.amount - (d.amount_settled || 0);
            const applyAmount = Math.min(unSettled, remainingOffsetLent);
            d.amount_settled = (d.amount_settled || 0) + applyAmount;
            remainingOffsetLent -= applyAmount;
            if (d.amount_settled >= d.amount - 0.001) {
              d.amount_settled = d.amount;
              d.status = 'SETTLED';
              d.settled_at = d.settled_at || now;
            }
          }

          let remainingOffsetBorrowed = offsetAvailable;
          for (const d of borrowedDebts) {
            if (remainingOffsetBorrowed <= 0) break;
            const unSettled = d.amount - (d.amount_settled || 0);
            const applyAmount = Math.min(unSettled, remainingOffsetBorrowed);
            d.amount_settled = (d.amount_settled || 0) + applyAmount;
            remainingOffsetBorrowed -= applyAmount;
            if (d.amount_settled >= d.amount - 0.001) {
              d.amount_settled = d.amount;
              d.status = 'SETTLED';
              d.settled_at = d.settled_at || now;
            }
          }
          return true;
        }

        reconcileAllPayees() {
          const state = this.getState();
          let changed = false;
          for (const payee of state.payees) {
            if (this.reconcilePayeeDebts(state, payee.id)) changed = true;
          }
          if (changed) this.saveState(state);
        }

        async insertDebtRecord(params) {
          const state = this.getState();
          const newId = state.nextId.friend_debts++;
          const record = {
            id: newId,
            payee_id: params.payeeId,
            note: params.note || '',
            amount: params.amount,
            amount_settled: 0,
            type: params.type,
            status: 'PENDING',
            created_at: new Date().toISOString(),
          };
          state.friend_debts.unshift(record);
          this.saveState(state);
          this.reconcileAllPayees();
          return newId;
        }

        async getActiveDebtsByType(debtType) {
          this.reconcileAllPayees();
          const state = this.getState();
          const payeeMap = new Map(state.payees.map((p) => [p.id, p.name]));
          return state.friend_debts
            .filter((d) => d.type === debtType && d.status === 'PENDING')
            .map((d) => ({
              ...d,
              payee_name: payeeMap.get(d.payee_id) || 'Friend',
              pending_amount: d.amount - (d.amount_settled || 0),
            }))
            .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
        }

        async getTotalPendingByType(debtType) {
          this.reconcileAllPayees();
          const state = this.getState();
          return state.friend_debts
            .filter((d) => d.type === debtType && d.status === 'PENDING')
            .reduce((sum, d) => sum + (d.amount - (d.amount_settled || 0)), 0);
        }

        async settleDebt(debtId, targetAccountId) {
          const state = this.getState();
          const debt = state.friend_debts.find((d) => d.id === debtId);
          if (!debt) return;

          debt.status = 'SETTLED';
          debt.amount_settled = debt.amount;
          debt.settled_at = new Date().toISOString();

          const payee = state.payees.find((p) => p.id === debt.payee_id);
          const payeeName = payee?.name || 'Friend';

          let account = targetAccountId
            ? state.accounts.find((a) => a.id === targetAccountId)
            : state.accounts.find(isBankAccount);
          if (!account) account = state.accounts[0];

          if (account) {
            if (debt.type === 'LENT') {
              account.balance += debt.amount;
              state.transactions.unshift({
                id: state.nextId.transactions++,
                title: `Recovered from ${payeeName}`,
                amount: debt.amount,
                category: 'Friend Return',
                type: 'DEBT_RECOVERED',
                source_account_id: account.id,
                payee_id: debt.payee_id,
                created_at: new Date().toISOString(),
              });
            } else {
              account.balance -= debt.amount;
              state.transactions.unshift({
                id: state.nextId.transactions++,
                title: `Paid back to ${payeeName}`,
                amount: debt.amount,
                category: 'Friend Repayment',
                type: 'DEBT_REPAID',
                source_account_id: account.id,
                payee_id: debt.payee_id,
                created_at: new Date().toISOString(),
              });
            }
          }
          this.saveState(state);
        }

        async getFriendProfilesSummary() {
          this.reconcileAllPayees();
          const state = this.getState();
          const payeeMap = new Map(state.payees.map((p) => [p.id, p]));
          const debtsWithPayee = state.friend_debts.map((d) => ({
            ...d,
            payee_name: payeeMap.get(d.payee_id)?.name || 'Friend',
            pending_amount: d.amount - (d.amount_settled || 0),
          }));

          const profiles = [];
          for (const payee of state.payees) {
            const personDebts = debtsWithPayee
              .filter((d) => d.payee_id === payee.id)
              .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());

            const pendingLent = personDebts
              .filter((d) => d.type === 'LENT' && d.status === 'PENDING')
              .reduce((sum, d) => sum + (d.amount - (d.amount_settled || 0)), 0);

            const pendingBorrowed = personDebts
              .filter((d) => d.type === 'BORROWED' && d.status === 'PENDING')
              .reduce((sum, d) => sum + (d.amount - (d.amount_settled || 0)), 0);

            const settledDebts = personDebts.filter((d) => d.status === 'SETTLED');
            const totalSettled = settledDebts.reduce((sum, d) => sum + (d.amount_settled || d.amount), 0);
            const activeCount = personDebts.filter((d) => d.status === 'PENDING').length;

            const netPending = pendingLent - pendingBorrowed;
            const currentLent = netPending > 0 ? netPending : 0;
            const currentBorrowed = netPending < 0 ? Math.abs(netPending) : 0;

            profiles.push({
              payee,
              totalLentPending: currentLent,
              totalBorrowedPending: currentBorrowed,
              currentLent,
              currentBorrowed,
              netPendingBalance: netPending,
              activeCount,
              settledCount: settledDebts.length,
              totalSettledAmount: totalSettled,
              debts: personDebts,
            });
          }
          return profiles;
        }

        async settleNetDebt(payeeId, targetAccountId) {
          const state = this.getState();
          const pendingDebts = state.friend_debts.filter(
            (d) => d.payee_id === payeeId && d.status === 'PENDING'
          );
          if (pendingDebts.length === 0) return;

          const payee = state.payees.find((p) => p.id === payeeId);
          const payeeName = payee?.name || 'Friend';

          const totalLent = pendingDebts
            .filter((d) => d.type === 'LENT')
            .reduce((sum, d) => sum + (d.amount - (d.amount_settled || 0)), 0);
          const totalBorrowed = pendingDebts
            .filter((d) => d.type === 'BORROWED')
            .reduce((sum, d) => sum + (d.amount - (d.amount_settled || 0)), 0);

          const net = totalLent - totalBorrowed;
          const now = new Date().toISOString();
          for (const d of pendingDebts) {
            d.status = 'SETTLED';
            d.amount_settled = d.amount;
            d.settled_at = now;
          }

          let account = targetAccountId
            ? state.accounts.find((a) => a.id === targetAccountId)
            : state.accounts.find(isBankAccount);
          if (!account) account = state.accounts[0];

          if (account && net !== 0) {
            if (net > 0) {
              account.balance += net;
              state.transactions.unshift({
                id: state.nextId.transactions++,
                title: `Net Settled with ${payeeName}`,
                amount: net,
                category: 'Friend Return',
                type: 'DEBT_RECOVERED',
                source_account_id: account.id,
                payee_id: payeeId,
                created_at: now,
              });
            } else {
              const absNet = Math.abs(net);
              account.balance -= absNet;
              state.transactions.unshift({
                id: state.nextId.transactions++,
                title: `Net Repaid to ${payeeName}`,
                amount: absNet,
                category: 'Friend Repayment',
                type: 'DEBT_REPAID',
                source_account_id: account.id,
                payee_id: payeeId,
                created_at: now,
              });
            }
          }
          this.saveState(state);
        }

        async getMonthlySpendsByAccount(yearMonth, accountId) {
          const state = this.getState();
          const isAll = accountId === 'ALL';

          if (isAll) {
            const txs = state.transactions.filter(
              (tx) => tx.created_at.startsWith(yearMonth) && (tx.type === 'CC_SPEND' || tx.type === 'BANK_SPEND' || tx.type === 'DEBT_REPAID')
            );
            const total = txs.reduce((sum, tx) => sum + tx.amount, 0);
            return { directSpend: total, linkedCardSpend: 0, totalSpend: total, transactionCount: txs.length };
          }

          const acc = state.accounts.find((a) => a.id === accountId);
          if (!acc) return { directSpend: 0, linkedCardSpend: 0, totalSpend: 0, transactionCount: 0 };

          const directTxs = state.transactions.filter(
            (tx) => tx.created_at.startsWith(yearMonth) && tx.source_account_id === accountId &&
              (tx.type === 'CC_SPEND' || tx.type === 'BANK_SPEND' || tx.type === 'DEBT_REPAID')
          );
          const directSpend = directTxs.reduce((sum, tx) => sum + tx.amount, 0);

          let linkedCardSpend = 0;
          let linkedTxCount = 0;
          if (isBankAccount(acc)) {
            const linkedCards = state.accounts.filter(
              (a) => isCreditCard(a) && a.linked_bank_id === acc.id
            );
            for (const card of linkedCards) {
              const cardTxs = state.transactions.filter(
                (tx) => tx.created_at.startsWith(yearMonth) && tx.source_account_id === card.id && tx.type === 'CC_SPEND'
              );
              linkedCardSpend += cardTxs.reduce((sum, tx) => sum + tx.amount, 0);
              linkedTxCount += cardTxs.length;
            }
          }

          return {
            directSpend,
            linkedCardSpend,
            totalSpend: directSpend + linkedCardSpend,
            transactionCount: directTxs.length + linkedTxCount,
          };
        }

        async getReportData(yearMonth, accountId = 'ALL') {
          const state = this.getState();
          const isSingleAccount = accountId !== 'ALL';
          const targetAccount = isSingleAccount ? state.accounts.find((a) => a.id === accountId) : null;

          const monthlyTxs = state.transactions.filter((tx) => {
            if (!tx.created_at.startsWith(yearMonth)) return false;
            if (isSingleAccount) return tx.source_account_id === accountId;
            return true;
          });

          let ccTotal = 0;
          let ccCount = 0;
          let bankTotal = 0;
          let bankCount = 0;
          const categoryMap = {};

          for (const tx of monthlyTxs) {
            if (tx.type === 'CC_SPEND') {
              ccTotal += tx.amount;
              ccCount++;
              categoryMap[tx.category] = (categoryMap[tx.category] || 0) + tx.amount;
            } else if (tx.type === 'BANK_SPEND' || tx.type === 'DEBT_REPAID') {
              bankTotal += tx.amount;
              bankCount++;
              categoryMap[tx.category] = (categoryMap[tx.category] || 0) + tx.amount;
            }
          }

          const settledDebts = state.friend_debts.filter(
            (d) => d.status === 'SETTLED' && d.settled_at && d.settled_at.startsWith(yearMonth)
          );

          const recoveredTotal = isSingleAccount && targetAccount && isCreditCard(targetAccount)
            ? 0
            : settledDebts.filter((d) => d.type === 'LENT').reduce((sum, d) => sum + (d.amount_settled || d.amount), 0);

          const repaidTotal = isSingleAccount && targetAccount && isCreditCard(targetAccount)
            ? 0
            : settledDebts.filter((d) => d.type === 'BORROWED').reduce((sum, d) => sum + (d.amount_settled || d.amount), 0);

          const totalOutflow = ccTotal + bankTotal;

          const categories = Object.entries(categoryMap)
            .map(([name, amount]) => ({
              name,
              amount,
              percentage: totalOutflow > 0 ? Math.round((amount / totalOutflow) * 100) : 0,
            }))
            .sort((a, b) => b.amount - a.amount);

          return {
            selectedAccount: targetAccount || null,
            totalOutflow,
            ccTotal,
            ccCount,
            bankTotal,
            bankCount,
            repaidTotal,
            recoveredTotal,
            categories,
            transactions: monthlyTxs,
          };
        }

        async exportSpendsCsv(accountId = 'ALL', yearMonth) {
          const state = this.getState();
          const accountMap = new Map(state.accounts.map((a) => [a.id, a.name]));

          let filtered = state.transactions;
          if (yearMonth) {
            filtered = filtered.filter((tx) => tx.created_at.startsWith(yearMonth));
          }
          if (accountId !== 'ALL') {
            filtered = filtered.filter((tx) => tx.source_account_id === accountId);
          }

          const rows = [
            ['Date', 'Time', 'Title', 'Category', 'Account', 'Payment Type', 'Amount (INR)'],
          ];

          for (const tx of filtered) {
            const date = new Date(tx.created_at);
            const dateStr = date.toLocaleDateString('en-IN');
            const timeStr = date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            const accName = accountMap.get(tx.source_account_id) || 'Account';
            const pType = tx.type === 'CC_SPEND' ? 'Credit Card' : tx.type === 'BANK_SPEND' ? 'Bank Direct / UPI' : tx.type;

            rows.push([
              `"${dateStr}"`,
              `"${timeStr}"`,
              `"${tx.title.replace(/"/g, '""')}"`,
              `"${tx.category}"`,
              `"${accName.replace(/"/g, '""')}"`,
              `"${pType}"`,
              tx.amount.toFixed(2),
            ]);
          }

          return rows.map((r) => r.join(',')).join('\n');
        }
      }

      async function refreshData() {
        appState.cycleStartDay = dbHelper.getCycleStartDay();
        appState.accounts = await dbHelper.getAccounts();
        appState.transactions = await dbHelper.getRecentTransactions(20);
        appState.payees = await dbHelper.getPayees();
        appState.debtsLent = await dbHelper.getActiveDebtsByType('LENT');
        appState.debtsBorrowed = await dbHelper.getActiveDebtsByType('BORROWED');

        // Verify selected bank exists
        const bankAccounts = appState.accounts.filter(isBankAccount);
        if (appState.selectedBankId !== 'ALL' && !bankAccounts.some((b) => b.id.toString() === appState.selectedBankId)) {
          appState.selectedBankId = 'ALL';
          localStorage.setItem(STORAGE_KEY_SELECTED_BANK, 'ALL');
        }

        // Friend profiles summary
        appState.profiles = await dbHelper.getFriendProfilesSummary();
        appState.totalToGetBack = appState.profiles
          .filter((p) => p.netPendingBalance > 0)
          .reduce((sum, p) => sum + p.netPendingBalance, 0);

        appState.totalIHaveToPay = appState.profiles
          .filter((p) => p.netPendingBalance < 0)
          .reduce((sum, p) => sum + Math.abs(p.netPendingBalance), 0);

        // Current month outflow
        const currentYearMonth = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
        const curReport = await dbHelper.getReportData(currentYearMonth, 'ALL');
        appState.monthlySpends = curReport.totalOutflow;

        // Bank-wise spend breakdown for hero
        if (appState.selectedSpendAccountId === 'ALL') {
          appState.spendBreakdown = { directSpend: appState.monthlySpends, linkedCardSpend: 0, totalSpend: appState.monthlySpends, transactionCount: 0 };
        } else {
          const accId = parseInt(appState.selectedSpendAccountId, 10);
          if (!isNaN(accId)) {
            appState.spendBreakdown = await dbHelper.getMonthlySpendsByAccount(currentYearMonth, accId);
          }
        }

        // Reports tab data
        const rYearMonth = `${appState.reportsDate.getFullYear()}-${String(appState.reportsDate.getMonth() + 1).padStart(2, '0')}`;
        appState.reportData = await dbHelper.getReportData(rYearMonth, appState.reportsAccountId);

        renderApp();
      }

      function renderReportsTab() {
        if (!appState.reportData) {
          return '<div class="py-20 text-center text-white/40 text-xs">Compiling reports from SQLite...</div>';
        }

        const {
          selectedAccount,
          totalOutflow,
          ccTotal,
          bankTotal,
          repaidTotal,
          recoveredTotal,
          categories,
          transactions,
        } = appState.reportData;

        const isFiltered = appState.reportsAccountId !== 'ALL';
        const isSelectedCard = selectedAccount && isCreditCard(selectedAccount);
        const netSettled = recoveredTotal - repaidTotal;

        const monthLabel = appState.reportsDate.toLocaleString('default', {
          month: 'long',
          year: 'numeric',
        });

        const getCategoryIcon = (name) => {
          const lower = name.toLowerCase();
          if (lower.includes('food') || lower.includes('canteen')) return icons.utensils('w-3.5 h-3.5 text-[#10B981]');
          if (lower.includes('upi') || lower.includes('quick') || lower.includes('needs')) return icons.zap('w-3.5 h-3.5 text-[#F59E0B]');
          if (lower.includes('travel') || lower.includes('fuel') || lower.includes('uber')) return icons.car('w-3.5 h-3.5 text-[#8B5CF6]');
          return icons.laptop('w-3.5 h-3.5 text-blue-400');

          const activeTab = modalProps.friendTab || 'PENDING';

          const pendingLent = pendingDebts

            .reduce((sum, d) => sum + (d.pending_amount !== undefined ? d.pending_amount : d.amount - (d.amount_settled || 0)), 0);

          const pendingBorrowed = pendingDebts
            .filter((d) => d.type === 'BORROWED')
            .reduce((sum, d) => sum + (d.pending_amount !== undefined ? d.pending_amount : d.amount - (d.amount_settled || 0)), 0);

          const netBalance = pendingLent - pendingBorrowed;
          const currentLent = netBalance > 0 ? netBalance : 0;
          const currentBorrowed = netBalance < 0 ? Math.abs(netBalance) : 0;
          const hasBoth = pendingLent > 0 && pendingBorrowed > 0;
          const bankAccounts = appState.accounts.filter(isBankAccount);
          const initial = (payee.name || 'F').trim().charAt(0).toUpperCase();

          return `

                        </button>

                  </div>

                  <!-- Quick Add Buttons -->

                  <!-- Debt Items List -->
                  ${activeTab === 'PENDING' ? `
                    ${pendingDebts.length === 0 ? `

                    ` : `
                      <div class="space-y-2.5">

                                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold border ${
                                  isL ? 'bg-[#10B981]/15 text-[#10B981] border-[#10B981]/30' : 'bg-[#F59E0B]/15 text-[#F59E0B] border-[#F59E0B]/30'
                                }">
                                  ${isL ? 'Lent (You Paid)' : 'Borrowed (They Paid)'}
                                </span>
                                <span class="text-sm font-extrabold text-white">${formatINR(amt, false)}</span>
                              </div>
                              <p class="text-xs text-white/80 font-medium mt-1.5">
                                ${item.note || (isL ? 'Shared expense paid by you' : 'Shared expense paid by them')}
                              </p>
                              <div class="flex items-center justify-between mt-3 pt-2.5 border-t border-white/5">
                                <div class="flex items-center gap-1 text-[11px] text-white/40">
                                  ${icons.clock('w-3 h-3 text-white/30')}
                                  <span>${timeAgo(item.created_at)}</span>
                                </div>
                                <button
                                  type="button"
                                  onclick="handleSettleSingle(${item.id}, '${item.type}', ${amt})"
                                  class="flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold transition-all cursor-pointer active:scale-95 ${
                                    isL ? 'bg-[#10B981]/15 text-[#10B981] hover:bg-[#10B981]/25 border border-[#10B981]/30' : 'bg-[#F59E0B]/15 text-[#F59E0B] hover:bg-[#F59E0B]/25 border border-[#F59E0B]/30'
                                  }"
                                >
                                  ${icons.check('w-3.5 h-3.5')}
                                  <span>${isL ? 'Mark as Paid (Got Back)' : 'Mark as Paid (Paid Back)'}</span>
                                </button>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    `}
                  ` : `
                    ${settledDebts.length === 0 ? `
                      <div class="bg-[#18181B] border border-white/5 rounded-2xl p-6 text-center text-xs text-white/40">
                        No past settled records with ${payee.name}.
                      </div>
                    ` : `
                      <div class="space-y-2">
                        ${settledDebts.map((item) => `
                          <div class="bg-[#18181B]/60 border border-white/5 rounded-xl p-3 flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                              <div class="w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-[#10B981]">
                                ${icons.check('w-3.5 h-3.5')}
                              </div>
                              <div>
                                <p class="text-xs font-medium text-white/70 line-clamp-1">
                                  ${item.note || (item.type === 'LENT' ? 'Lent money' : 'Borrowed money')}
                                </p>
                                <p class="text-[10px] text-white/30 flex items-center gap-1 mt-0.5">
                                  <span>Originally ${item.type === 'LENT' ? 'Lent' : 'Borrowed'}</span>
                                  <span>•</span>
                                  <span>Settled ${item.settled_at ? timeAgo(item.settled_at) : 'recently'}</span>
                                </p>
                              </div>
                            </div>
                            <div class="text-right">
                              <span class="text-xs font-bold text-white/60 line-through">
                                ${formatINR(item.amount_settled || item.amount, false)}
                              </span>
                              <span class="block text-[9px] font-bold text-[#10B981] uppercase tracking-wider">Paid</span>
                            </div>
                          </div>
                        `).join('')}
                      </div>
                    `}
                  `}
                </div>

                <div class="pt-3 border-t border-white/10 shrink-0">
                  <button type="button" onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-[#18181B] border border-white/10 text-white font-semibold text-xs hover:bg-[#27272A] cursor-pointer">
                    Done
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        if (activeModal === 'PREAUTH_CONTACTS') {
          return `
            <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex justify-center items-end sm:items-center p-0 sm:p-4">
              <div class="w-full max-w-md bg-[#121212] border border-white/10 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-in slide-in-from-bottom duration-200 max-h-[85vh] flex flex-col">
                <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4 shrink-0">
                  <div class="flex items-center gap-2">
                    <div class="text-[#10B981]">${icons.users('w-4 h-4')}</div>
                    <h3 class="font-bold text-sm text-white">Pre-authorized Contacts</h3>
                  </div>
                  <button onclick="closeModal()" class="p-1 rounded-lg text-white/40 hover:text-white hover:bg-white/5 cursor-pointer">
                    ${icons.x('w-4 h-4')}
                  </button>
                </div>

                <p class="text-xs text-white/40 mb-3 shrink-0">
                  Pre-save verified friends and contacts for instant shared splits.
                </p>

                <form onsubmit="handleSavePreauthContact(event)" class="p-3 bg-[#18181B] rounded-2xl mb-4 shrink-0 space-y-2">
                  <span class="text-[10px] font-bold text-[#10B981] uppercase tracking-wider">
                    + Add Pre-authorized Contact
                  </span>
                  <input id="new-contact-name" type="text" placeholder="Full name (e.g. Sahil Khan)" required class="w-full px-3 py-2 bg-[#27272A] border border-white/10 rounded-xl text-white text-xs placeholder:text-white/20 focus:outline-none focus:border-[#10B981]" />
                  <input id="new-contact-phone" type="tel" placeholder="Phone (e.g. +91 98765 00000)" class="w-full px-3 py-2 bg-[#27272A] border border-white/10 rounded-xl text-white text-xs placeholder:text-white/20 focus:outline-none focus:border-[#10B981]" />
                  <button type="submit" class="w-full py-2 bg-[#10B981] text-black font-bold text-xs rounded-xl hover:bg-[#34D399] cursor-pointer">
                    Save Contact
                  </button>
                </form>

                <div class="overflow-y-auto space-y-2 pr-1 flex-1">
                  <p class="text-[11px] font-bold text-white/50 uppercase tracking-wider mb-1">
                    Authorized Whitelist (${appState.payees.length})
                  </p>
                  ${appState.payees.map((p) => {
                    const init = (p.name || 'F').trim().charAt(0).toUpperCase();
                    return `
                      <div class="p-2.5 rounded-xl bg-[#18181B] border border-white/5 flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                          <div class="w-8 h-8 rounded-full bg-[#27272A] flex items-center justify-center font-bold text-xs text-white">

                          <div>
                            <p class="text-xs font-semibold text-white">${p.name}</p>

                  Done

              </div>
            </div>

        }

        return '';

      // ==========================================
      // ACTION HANDLERS
      // ==========================================
      function setTab(tab) {
        appState.activeTab = tab;
        renderApp();
      }

      function openModal(modalType, props = {}) {
        appState.activeModal = modalType;
        appState.modalProps = { ...props };
        if (modalType === 'NOTIFICATIONS') {
          appState.unreadNotification = false;
        }
        renderApp();
      }

      function closeModal() {
        appState.activeModal = null;
        appState.modalProps = {};
        renderApp();
      }

      function openEditName() {
        appState.isEditingName = true;
        appState.tempName = appState.userName;
        renderApp();
        setTimeout(() => {
          const el = document.getElementById('edit-name-input');
          if (el) el.focus();
        }, 50);
      }

      function cancelEditName() {
        appState.isEditingName = false;
        renderApp();
      }

      function handleSaveName(e) {
        if (e) e.preventDefault();
        const input = document.getElementById('edit-name-input');
        const cleanName = (input ? input.value : appState.tempName).trim() || 'User';
        appState.userName = cleanName;
        localStorage.setItem(STORAGE_KEY_USER_NAME, cleanName);
        appState.isEditingName = false;
        renderApp();
      }

      function setHeroMetric(metric) {
        appState.heroMetric = metric;
        renderApp();
      }

      function handleSelectBank(val) {
        appState.selectedBankId = val;
        localStorage.setItem(STORAGE_KEY_SELECTED_BANK, val);
        renderApp();
      }

      async function handleSelectSpendAccount(val) {
        appState.selectedSpendAccountId = val;
        localStorage.setItem(STORAGE_KEY_SELECTED_SPEND_ACC, val);
        const currentYearMonth = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
        if (val === 'ALL') {
          appState.spendBreakdown = { directSpend: appState.monthlySpends, linkedCardSpend: 0, totalSpend: appState.monthlySpends, transactionCount: 0 };
        } else {
          const accId = parseInt(val, 10);
          if (!isNaN(accId)) {
            appState.spendBreakdown = await dbHelper.getMonthlySpendsByAccount(currentYearMonth, accId);
          }
        }
        renderApp();
      }

      function setFriendsFilter(filter) {
        appState.friendsFilter = filter;
        renderApp();
      }

      function toggleFriendsSearch() {
        appState.friendsShowSearch = !appState.friendsShowSearch;
        if (!appState.friendsShowSearch) appState.friendsSearch = '';
        renderApp();
        if (appState.friendsShowSearch) {
          setTimeout(() => {
            const el = document.getElementById('friends-search-input');
            if (el) el.focus();
          }, 50);
        }
      }

      function handleFriendsSearch(val) {
        appState.friendsSearch = val;
        renderApp();
      }

      function toggleFriendsSort() {
        appState.friendsSortBy = appState.friendsSortBy === 'recent' ? 'amount' : 'recent';
        renderApp();
      }

      function handlePrevMonth() {
        const d = appState.reportsDate;
        appState.reportsDate = new Date(d.getFullYear(), d.getMonth() - 1, 1);
        refreshData();
      }

      function handleNextMonth() {
        const d = appState.reportsDate;
        appState.reportsDate = new Date(d.getFullYear(), d.getMonth() + 1, 1);
        refreshData();
      }

      function setReportsAccount(accId) {
        appState.reportsAccountId = accId;
        refreshData();
      }

      async function handleDownloadCsv() {
        const rYearMonth = `${appState.reportsDate.getFullYear()}-${String(appState.reportsDate.getMonth() + 1).padStart(2, '0')}`;
        const csv = await dbHelper.exportSpendsCsv(appState.reportsAccountId, rYearMonth);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);

        let filename = `budgetflow_spends_${rYearMonth}`;
        if (appState.reportsAccountId !== 'ALL') {
          const acc = appState.accounts.find((a) => a.id === appState.reportsAccountId);
          if (acc) filename += `_${acc.name.replace(/\s+/g, '_')}`;
        }
        link.setAttribute('download', `${filename}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        appState.exportNotice = true;
        renderApp();
        setTimeout(() => {
          appState.exportNotice = false;
          renderApp();
        }, 3500);
      }

      function setCycleModalDay(day) {
        const cleanDay = Math.min(31, Math.max(1, parseInt(day, 10) || 1));
        appState.modalProps.selectedDay = cleanDay;
        renderApp();
      }

      function handleCustomCycleDayInput(val) {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed) && parsed >= 1 && parsed <= 31) {
          appState.modalProps.selectedDay = parsed;
          renderApp();
          const input = document.getElementById('custom-cycle-day-input');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }
      }

      async function saveCycleDay(day) {
        dbHelper.setCycleStartDay(day);
        closeModal();
        await refreshData();
      }

      function updateSpendModalAccount(accId) {
        appState.modalProps.selectedAccountId = accId;
        renderApp();
      }

      function setSpendModalCategory(cat) {
        appState.modalProps.category = cat;
        renderApp();
      }

      async function handleSubmitSpend(e, type) {
        e.preventDefault();
        const amtInput = document.getElementById('spend-amount-input');
        const titleInput = document.getElementById('spend-title-input');
        const accSelect = document.getElementById('spend-account-select');

        const amount = parseFloat(amtInput?.value || 0);
        if (isNaN(amount) || amount <= 0) return;

        const accId = Number(accSelect?.value);
        const acc = appState.accounts.find((a) => a.id === accId);
        if (!acc) return;

        const category = appState.modalProps.category || 'Food & Canteen';
        const isCard = isCreditCard(acc);

        const defaultTitle = type === 'TOPUP'
          ? 'Bank Deposit / Top-up'
          : isCard ? `${category} (Card Pay)` : `${category} (UPI)`;

        const finalTitle = titleInput?.value.trim() || defaultTitle;
        const nowIso = new Date().toISOString();

        if (type === 'TOPUP') {
          await dbHelper.updateAccountBalance(acc.id, (acc.balance || 0) + amount);
          await dbHelper.insertTransaction({
            title: finalTitle,
            amount: amount,
            category: 'Deposit / Top-up',
            type: 'TOPUP',
            source_account_id: acc.id,
            created_at: nowIso,
          });
        } else {
          if (isCard) {
            await dbHelper.updateAccountDues(acc.id, (acc.unbilled_dues || 0) + amount);
            await dbHelper.insertTransaction({
              title: finalTitle,
              amount: amount,
              category: category,
              type: 'CC_SPEND',
              source_account_id: acc.id,
              created_at: nowIso,
            });
          } else {
            await dbHelper.updateAccountBalance(acc.id, (acc.balance || 0) - amount);
            await dbHelper.insertTransaction({
              title: finalTitle,
              amount: amount,
              category: category,
              type: 'BANK_SPEND',
              source_account_id: acc.id,
              created_at: nowIso,
            });
          }
        }

        closeModal();
        await refreshData();
      }

      function setAddAccountType(type) {
        appState.modalProps.accountType = type;
        renderApp();
      }

      function toggleIncludeCC(checked) {
        appState.modalProps.includeCreditCard = checked;
        renderApp();
      }

      async function handleSubmitAddAccount(e, accountType) {
        e.preventDefault();
        const nameInput = document.getElementById('acc-name-input');
        const name = nameInput?.value.trim();
        if (!name) return;

        if (accountType === 'BANK') {
          const balInput = document.getElementById('acc-balance-input');
          const balance = parseFloat(balInput?.value || 0) || 0;
          const createdBank = await dbHelper.createAccount({
            name,
            type: 'BANK',
            balance,
            unbilled_dues: 0,
          });

          if (appState.modalProps.includeCreditCard) {
            const ccNameInput = document.getElementById('acc-attached-cc-name');
            const ccDuesInput = document.getElementById('acc-attached-cc-dues');
            const ccName = ccNameInput?.value.trim() || `${name} Credit Card`;
            const ccDues = parseFloat(ccDuesInput?.value || 0) || 0;
            await dbHelper.createAccount({
              name: ccName,
              type: 'CREDIT_CARD',
              linked_bank_id: createdBank.id,
              balance: 0,
              unbilled_dues: ccDues,
            });
          }
        } else {
          const linkedSelect = document.getElementById('acc-linked-bank-select');
          const duesInput = document.getElementById('acc-card-dues-input');
          const limitInput = document.getElementById('acc-credit-limit-input');

          const linkedId = linkedSelect?.value ? Number(linkedSelect.value) : null;
          const dues = parseFloat(duesInput?.value || 0) || 0;
          const limit = limitInput?.value ? parseFloat(limitInput.value) : undefined;

          await dbHelper.createAccount({
            name,
            type: 'CREDIT_CARD',
            linked_bank_id: linkedId,
            balance: 0,
            unbilled_dues: dues,
            credit_limit: limit,
          });
        }

        closeModal();
        await refreshData();
      }

      function startEditAccount(accId, currentVal) {
        appState.modalProps.editingAccountId = accId;
        appState.modalProps.editAmount = currentVal;
        renderApp();
      }

      function cancelEditAccount() {
        appState.modalProps.editingAccountId = null;
        renderApp();
      }

      async function saveEditAccount(accId) {
        const input = document.getElementById('edit-acc-amount-input');
        const val = parseFloat(input?.value || 0);
        if (isNaN(val)) return;

        const acc = appState.accounts.find((a) => a.id === accId);
        if (!acc) return;

        if (isCreditCard(acc)) {
          await dbHelper.updateAccountDues(accId, val);
        } else {
          await dbHelper.updateAccountBalance(accId, val);
        }

        appState.modalProps.editingAccountId = null;
        await refreshData();
      }

      async function handleDeleteAccount(accId) {
        try {
          await dbHelper.deleteAccount(accId);
          await refreshData();
        } catch (err) {
          appState.modalProps.error = err.message || 'Cannot delete this account';
          renderApp();
        }
      }

      function toggleDebtNewContact() {
        appState.modalProps.isNewContact = !appState.modalProps.isNewContact;
        renderApp();
      }

      async function handleSubmitDebt(e, type) {
        e.preventDefault();
        const amtInput = document.getElementById('debt-amount-input');
        const noteInput = document.getElementById('debt-note-input');
        const amount = parseFloat(amtInput?.value || 0);
        if (isNaN(amount) || amount <= 0) return;

        let payeeId;
        if (appState.modalProps.isNewContact || appState.payees.length === 0) {
          const nameInput = document.getElementById('debt-new-name');
          const phoneInput = document.getElementById('debt-new-phone');
          const name = nameInput?.value.trim();
          if (!name) return;
          payeeId = await dbHelper.insertPayee(name, phoneInput?.value.trim() || '');
        } else {
          const select = document.getElementById('debt-payee-select');
          payeeId = Number(select?.value);
        }

        const note = noteInput?.value.trim() || (type === 'LENT' ? 'Direct payment' : 'Shared expense');
        await dbHelper.insertDebtRecord({
          payeeId,
          amount,
          type,
          note,
        });

        closeModal();
        await refreshData();
      }

      function openFriendProfileModal(payeeId) {
        const payee = appState.payees.find((p) => p.id === payeeId);
        if (!payee) return;
        openModal('FRIEND_PROFILE', { payee, friendTab: 'PENDING' });
      }

      function setFriendProfileTab(tab) {
        appState.modalProps.friendTab = tab;
        renderApp();
      }

      async function handleSettleDirect(debtId) {
        await dbHelper.settleDebt(debtId);
        await refreshData();
      }

      async function handleSettleSingle(debtId, debtType, amount) {
        const select = document.getElementById('friend-settle-account-select');
        const targetAccId = select ? Number(select.value) : undefined;
        await dbHelper.settleDebt(debtId, targetAccId);

        const targetAcc = appState.accounts.find((a) => a.id === targetAccId);
        const accName = targetAcc ? targetAcc.name : 'Bank Account';
        appState.modalProps.toast = debtType === 'LENT'
          ? `Marked as paid! ${formatINR(amount, false)} received into ${accName}.`
          : `Marked as paid! ${formatINR(amount, false)} paid back from ${accName}.`;

        renderApp();
        await refreshData();
        setTimeout(() => {
          if (appState.modalProps) {
            appState.modalProps.toast = null;
            renderApp();
          }
        }, 3500);
      }

      async function handleSettleNet(payeeId) {
        const select = document.getElementById('friend-settle-account-select');
        const targetAccId = select ? Number(select.value) : undefined;
        await dbHelper.settleNetDebt(payeeId, targetAccId);

        const targetAcc = appState.accounts.find((a) => a.id === targetAccId);
        const accName = targetAcc ? targetAcc.name : 'Bank Account';
        appState.modalProps.toast = `Net settled successfully with ${accName}!`;

        renderApp();
        await refreshData();
        setTimeout(() => {
          if (appState.modalProps) {
            appState.modalProps.toast = null;
            renderApp();
          }
        }, 3500);
      }

      async function handleSavePreauthContact(e) {
        e.preventDefault();
        const nameInput = document.getElementById('new-contact-name');
        const phoneInput = document.getElementById('new-contact-phone');
        const name = nameInput?.value.trim();
        if (!name) return;

        await dbHelper.insertPayee(name, phoneInput?.value.trim() || '');
        await refreshData();
      }

      async function handleResetData() {
        localStorage.removeItem('budgetflow_user_name');
        appState.userName = 'User';
        dbHelper.resetToSample();
        closeModal();
        await refreshData();
      }

      async function handleClearAllDataFullFresh() {
        try {
          localStorage.removeItem('budgetflow_prod_db_v1');
          localStorage.removeItem('budgetflow_cycle_day_v2');
          localStorage.removeItem('budgetflow_user_name');
          localStorage.removeItem('budgetflow_hero_selected_bank_v1');
          localStorage.removeItem('budgetflow_hero_selected_spend_acc_v1');
          localStorage.removeItem('budgetflow_sqlite_db_v2');
          localStorage.removeItem('budgetflow_sqlite_db_v3');
        } catch (e) {
          console.error('Failed to clear storage:', e);
        }

        dbHelper.resetToSample();

        appState.userName = 'User';
        appState.cycleStartDay = 1;
        appState.selectedBankId = 'ALL';
        appState.selectedSpendAccountId = 'ALL';
        appState.activeTab = 'dashboard';
        appState.unreadNotification = true;
        closeModal();

        await refreshData();
      }

      // ==========================================
      // ROOT RENDER APP FUNCTION
      // ==========================================
      function renderApp() {
        const main = document.getElementById('main-content');
        const bottomNav = document.getElementById('bottom-nav');
        const modalContainer = document.getElementById('modal-container');

        let mainHtml = renderHeader();

        if (appState.activeTab === 'dashboard') {
          mainHtml += `
            <div class="animate-in fade-in duration-200">
              ${renderCycleBanner()}
              ${renderHeroFinancialCard()}
              ${renderQuickActions()}
              ${renderLinkedAccounts()}
              ${renderRecentActivity()}
            </div>
          `;
        } else if (appState.activeTab === 'friends') {
          mainHtml += `
            <div class="animate-in fade-in duration-200">
              ${renderFriendsTab()}
            </div>
          `;
        } else if (appState.activeTab === 'reports') {
          mainHtml += `
            <div class="animate-in fade-in duration-200">
              ${renderReportsTab()}
            </div>
          `;
        }

        main.innerHTML = mainHtml;
        bottomNav.innerHTML = renderBottomNav();
        modalContainer.innerHTML = renderModals();
      }

      // Expose to window
      window.setTab = setTab;
      window.openModal = openModal;
      window.closeModal = closeModal;
      window.openEditName = openEditName;
      window.cancelEditName = cancelEditName;
      window.handleSaveName = handleSaveName;
      window.setHeroMetric = setHeroMetric;
      window.handleSelectBank = handleSelectBank;
      window.handleSelectSpendAccount = handleSelectSpendAccount;
      window.setFriendsFilter = setFriendsFilter;
      window.toggleFriendsSearch = toggleFriendsSearch;
      window.handleFriendsSearch = handleFriendsSearch;
      window.toggleFriendsSort = toggleFriendsSort;
      window.handlePrevMonth = handlePrevMonth;
      window.handleNextMonth = handleNextMonth;
      window.setReportsAccount = setReportsAccount;
      window.handleDownloadCsv = handleDownloadCsv;
      window.setCycleModalDay = setCycleModalDay;
      window.handleCustomCycleDayInput = handleCustomCycleDayInput;
      window.saveCycleDay = saveCycleDay;
      window.updateSpendModalAccount = updateSpendModalAccount;
      window.setSpendModalCategory = setSpendModalCategory;
      window.handleSubmitSpend = handleSubmitSpend;
      window.setAddAccountType = setAddAccountType;
      window.toggleIncludeCC = toggleIncludeCC;
      window.handleSubmitAddAccount = handleSubmitAddAccount;
      window.startEditAccount = startEditAccount;
      window.cancelEditAccount = cancelEditAccount;
      window.saveEditAccount = saveEditAccount;
      window.handleDeleteAccount = handleDeleteAccount;
      window.toggleDebtNewContact = toggleDebtNewContact;
      window.handleSubmitDebt = handleSubmitDebt;
      window.openFriendProfileModal = openFriendProfileModal;
      window.setFriendProfileTab = setFriendProfileTab;
      window.handleSettleDirect = handleSettleDirect;
      window.handleSettleSingle = handleSettleSingle;
      window.handleSettleNet = handleSettleNet;
      window.handleSavePreauthContact = handleSavePreauthContact;
      window.handleResetData = handleResetData;
      window.handleClearAllDataFullFresh = handleClearAllDataFullFresh;

      // Initialize on load
      document.addEventListener('DOMContentLoaded', () => {
        refreshData();
      });
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        refreshData();
      }




    </script>
  </body>
</html>
